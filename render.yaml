# Render blueprint: one web service that serves the API and the built React page.
# Database: Supabase (set DATABASE_URL in the Render dashboard; see docs/deploy.md).
services:
  - type: web
    name: senya
    runtime: node
    plan: free
    buildCommand: cd platform/web && npm ci && npm run build && cd ../server && npm ci
    startCommand: cd platform/server && node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DATABASE_URL
        sync: false
